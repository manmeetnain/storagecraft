name: Bug report
description: Report a reproducible problem in the site, CLI, or simulator.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make StorageCraft dependable.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Documentation, CLI, RAID simulator, Build or deployment, Accessibility]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 22, Safari 18
