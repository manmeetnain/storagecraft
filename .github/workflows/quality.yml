name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check
      - run: NO_COLOR=1 npm run craft -- doctor
      - run: NO_COLOR=1 npm run craft -- raid --level 6 --disks 8 --size 4
      - run: NO_COLOR=1 npm run craft -- raid --level 60 --disks 16 --size 8 --groups 2
      - run: NO_COLOR=1 npm run craft -- raid --compare --disks 12 --size 8 --groups 2
      - run: NO_COLOR=1 npm run craft -- erasure --data 10 --parity 4 --dataset 100 --failures 2
      - run: NO_COLOR=1 npm run craft -- write-path --preset lsm --logical 1
      - run: NO_COLOR=1 npm run craft -- lsm --policy leveled --dataset 500 --memtable 512 --ratio 10
      - run: NO_COLOR=1 npm run craft -- gpu-plan --preset llama70 --gpus 1 --gpu-memory 80 --tokens 8192
      - run: NO_COLOR=1 npm run craft -- rag-size --documents 1000000 --tokens 1200 --chunk 512 --overlap 64
      - run: NO_COLOR=1 npm run craft -- kv --layers 32 --heads 8 --dim 128 --tokens 8192 --bytes 2
