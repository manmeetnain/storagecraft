name: Python Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s test_python -v
        env:
          PYTHONPATH: python
      - run: python -m storagecraft_tools.cli raid --level 60 --disks 16 --size 4 --groups 2 --json
        env:
          PYTHONPATH: python
